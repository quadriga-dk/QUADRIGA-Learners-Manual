description: Diese Lernhinweise unterstützen Lernende bei der Nutzung von QUADRIGA-OERs.
  Sie erklären die Ausführungsmodi Lesen, Cloud und lokal, den Umgang mit Notebooks
  in Google Colab, Binder und JupyterHub sowie die Nutzung von Assessments. Die Hinweise
  sind zum Nachschlagen gedacht. Die Anleitung für OER-Erstellende und das Book_Template
  liegen in separaten Repositories.
